<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Dashboard - Data Visualization</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <main class="dashboard">
    <!-- Header -->
    <header class="dash-header">
      <div>
        <h1 class="dash-header__title">Sales Dashboard</h1>
        <p class="dash-header__subtitle" id="date-display"></p>
      </div>
      <div class="dash-header__actions">
        <select id="period" class="select" aria-label="Time period">
          <option value="last6m" selected>Last 6 months</option>
          <option value="last12m">Last 12 months</option>
          <option value="ytd">This year</option>
        </select>
      </div>
    </header>

    <!-- KPI cards -->
    <section class="kpi-grid" id="kpi-grid" aria-label="Key metrics"></section>

    <!-- Charts row 1 -->
    <section class="chart-grid">
      <div class="card chart-card chart-card--wide">
        <h2 class="card__title">Revenue Trend</h2>
        <div class="chart" id="revenue-chart" role="img" aria-label="Revenue trend line chart"></div>
      </div>
      <div class="card chart-card">
        <h2 class="card__title">Sales by Category</h2>
        <div class="chart" id="category-chart" role="img" aria-label="Sales by category bar chart"></div>
      </div>
    </section>

    <!-- Charts row 2 -->
    <section class="chart-grid">
      <div class="card chart-card">
        <h2 class="card__title">Traffic Sources</h2>
        <div class="chart" id="source-chart" role="img" aria-label="Traffic sources pie chart"></div>
      </div>
      <div class="card chart-card">
        <h2 class="card__title">Weekly Orders</h2>
        <div class="chart" id="orders-chart" role="img" aria-label="Weekly orders bar chart"></div>
      </div>
      <div class="card chart-card">
        <h2 class="card__title">Top Products</h2>
        <div class="chart" id="products-chart" role="img" aria-label="Top products horizontal bar chart"></div>
      </div>
    </section>

    <!-- Data table -->
    <section class="card table-card">
      <h2 class="card__title">Recent Orders</h2>
      <div class="table-wrap">
        <table class="table" id="orders-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Product</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
